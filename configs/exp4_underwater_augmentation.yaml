# Expérience 4 — YOLO11s avec augmentations
# dataset_yaml peut être remplacé par --dataset-yaml lors de l'exécution Kaggle.
dataset_yaml: data/processed/trashcan_yolo/data.yaml

model: yolo11s.pt
training:
  epochs: 50
  imgsz: 640
  batch: 8
  device: 0
  workers: 2
  patience: 15
  seed: 42

augmentation:
  hsv_h: 0.015
  hsv_s: 0.35
  hsv_v: 0.25
  degrees: 5.0
  translate: 0.1
  scale: 0.4
  fliplr: 0.5
  flipud: 0.1
  mosaic: 0.7
  mixup: 0.05
  close_mosaic: 10

output:
  project: outputs/train
  name: exp4_yolo11s
  evaluation_project: outputs/evaluation
  evaluation_name: exp4_evaluation
